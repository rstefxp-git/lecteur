<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lecteur</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#14161a">
<style>
:root{color-scheme:dark;--bg:#14161a;--card:#1d2127;--fg:#e9e7e2;--mut:#8d939c;--ac:#8ec5ff;--r:6px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid #262b32}
header input[type=search]{flex:1;min-width:0;background:var(--card);border:1px solid #2c323a;color:var(--fg);padding:8px 12px;border-radius:var(--r);font:inherit}
button,.btn{background:var(--card);border:1px solid #2c323a;color:var(--fg);padding:8px 12px;border-radius:var(--r);font:inherit;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#info{padding:10px 14px;color:var(--mut);font-size:13px;display:flex;gap:10px;align-items:center;min-height:42px}
#info button{padding:2px 8px;font-size:12px}
#ov{position:fixed;inset:0;z-index:20;background:#000}
#ov[hidden]{display:none}
#menu{position:fixed;top:0;left:0;bottom:0;width:min(100vw,720px);z-index:30;background:var(--bg);overflow:auto;overscroll-behavior:contain;box-shadow:0 0 40px #000a;transition:transform .22s ease,visibility 0s}
#menu.out{transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
#ov iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#po{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:1;pointer-events:none}
#po[hidden]{display:none}
@media (orientation:landscape){.sw{top:48px!important;bottom:20%!important}}
.sw{position:absolute;top:64px;bottom:22%;width:24%;z-index:2;touch-action:none}
#swl{left:0}
#swr{right:0}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px 12px;padding:0 14px 40px}
.card{cursor:pointer;min-width:0}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--card);border-radius:var(--r);display:block}
.card.on img{outline:2px solid var(--ac)}
.card h3{font-size:14px;font-weight:500;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch:hover{color:var(--ac);text-decoration:underline}
#vide{max-width:460px;margin:12vh auto;padding:0 20px;text-align:center;color:var(--mut)}
#vide[hidden]{display:none}
#vide b{display:block;color:var(--fg);font-size:18px;margin-bottom:8px}
body.drag{outline:2px dashed var(--ac);outline-offset:-8px}
</style>
</head>
<body>
<div id="ov">
  <iframe id="v" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <img id="po" alt="" hidden>
  <div class="sw" id="swl"></div>
  <div class="sw" id="swr"></div>
</div>



<div id="menu" class="out">
<header>
  <button id="mc" title="Retour à la vidéo (Échap)" hidden>✕</button>
  <input id="q" type="search" placeholder="Rechercher titre ou chaîne" autocomplete="off">
  <button id="s" title="Changer le tri">Récents</button>
  <label class="btn" for="f">Importer</label>
  <input id="f" type="file" accept=".json,application/json" multiple hidden>
</header>

<div id="info"></div>
<main id="g"></main>
<div id="end"></div>
<div id="vide" hidden>
  <b>Dépose ton fichier d'historique</b>
  Google Takeout → YouTube → historique, format JSON.<br>
  Fichier : <code>watch-history.json</code>. Il est gardé dans ce navigateur après import.
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all=[],view=[],shown=0,cur=-1,curId='',sort='recent',chan='';
const STEP=60;

/* stockage local */
const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open('lecteur',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
async function save(v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,'items')}catch{}}
async function load(){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('k').objectStore('k').get('items');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})}catch{}}

/* import Takeout */
function parse(arr,m){
  for(const e of arr){
    const x=(e.titleUrl||'').match(/[?&]v=([\w-]{11})/);if(!x)continue;
    const id=x[1],ts=Date.parse(e.time)||0;
    let t=(e.title||'').replace(/^(Watched|Vous avez regardé|Viewed)\s+/i,'');
    if(/^https?:\/\//.test(t))t='';
    const c=(e.subtitles&&e.subtitles[0]&&e.subtitles[0].name)||'';
    const o=m.get(id);
    if(o){o.n++;if(ts>o.d)o.d=ts;if(!o.t&&t)o.t=t;if(!o.c&&c)o.c=c}
    else m.set(id,{id,t,c,d:ts,n:1});
  }
}
async function importer(files){
  const m=new Map();
  for(const f of files){
    try{const j=JSON.parse(await f.text());if(Array.isArray(j))parse(j,m)}catch{alert('Fichier illisible : '+f.name)}
  }
  if(!m.size){alert('Aucune vidéo trouvée. Format attendu : watch-history.json');return}
  all=[...m.values()];chan='';save(all);apply();
}

/* liste */
function apply(){
  const q=$('#q').value.trim().toLowerCase();
  view=all.filter(i=>(!chan||i.c===chan)&&(!q||(i.t+' '+i.c).toLowerCase().includes(q)));
  view.sort(sort==='recent'?(a,b)=>b.d-a.d:(a,b)=>b.n-a.n||b.d-a.d);
  $('#g').innerHTML='';shown=0;cur=view.findIndex(v=>v.id===curId);more();
  $('#vide').hidden=all.length>0;
  const i=$('#info');
  i.innerHTML=all.length?esc(view.length+' vidéos')+(chan?' · '+esc(chan)+' <button id="rc">✕ chaîne</button>':''):'';
}
function more(){
  if(shown>=view.length)return;
  let h='';
  for(let i=shown;i<Math.min(shown+STEP,view.length);i++){
    const v=view[i];
    h+=`<article class="card${i===cur?' on':''}" data-i="${i}"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""><h3>${esc(v.t||'Vidéo '+v.id)}</h3><p>${v.c?`<span class="ch" data-c="${esc(v.c)}">${esc(v.c)}</span> · `:''}${v.d?new Date(v.d).toLocaleDateString('fr-FR'):''}${v.n>1?' · ×'+v.n:''}</p></article>`;
  }
  shown=Math.min(shown+STEP,view.length);
  $('#g').insertAdjacentHTML('beforeend',h);
}
new IntersectionObserver(e=>{if(e[0].isIntersecting)more()},{root:$('#menu'),rootMargin:'600px'}).observe($('#end'));

/* lecture */
let st=-1,menuOpen=false,ready=false,posterT;
const menu=$('#menu');
/* APK : lecteur multimédia (écran verrouillé) et lecture écran éteint */
let tcur=0,tdur=0,tLast=0;
function bgState(p){try{if(window.NativeBg)NativeBg.state(p,tcur,tdur)}catch{}}
function bgMeta(v){try{if(window.NativeBg)NativeBg.meta(v.t||'Vidéo',v.c||'',v.id)}catch{}}
window.__mc=(a,x)=>{   /* commandes venant de l'écran verrouillé */
  if(a==='play')cmd('playVideo');
  else if(a==='pause')cmd('pauseVideo');
  else if(a==='next')play(cur+1);
  else if(a==='prev')play(cur-1);
  else if(a==='seek')cmd('seekTo',[x,true]);
};
function cmd(f,a){try{$('#v').contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*')}catch{}}
function poster(id){const p=$('#po');p.src='https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';p.hidden=false;clearTimeout(posterT);posterT=setTimeout(()=>{p.hidden=true},4000)}
function openMenu(){
  if(menuOpen)return;menuOpen=true;menu.classList.remove('out');history.pushState({m:1},'');
  const c=$('.card.on');if(c)c.scrollIntoView({block:'center'});
}
function closeMenu(){
  if(!menuOpen)return;menuOpen=false;menu.classList.add('out');
  if(history.state&&history.state.m)history.back();
}
function play(i,start){
  if(i<0||i>=view.length)return;
  cur=i;const v=view[i];curId=v.id;st=-1;tcur=0;tdur=0;bgMeta(v);if(!start)bgState(true);
  try{localStorage.setItem('last',v.id)}catch{}
  if(ready&&!start){cmd('loadVideoById',[v.id]);poster(v.id)}   /* lecteur déjà chargé : changement quasi instantané */
  else{ready=false;$('#v').src=`https://www.youtube-nocookie.com/embed/${v.id}?autoplay=${start?0:1}&rel=0&playsinline=1&enablejsapi=1${/^https?:/.test(location.protocol)?'&origin='+encodeURIComponent(location.origin):''}`}
  document.querySelectorAll('.card.on').forEach(c=>c.classList.remove('on'));
  const c=$(`.card[data-i="${i}"]`);if(c)c.classList.add('on');
  $('#mc').hidden=false;
  closeMenu();
  if(!start&&!document.fullscreenElement){try{const r=document.documentElement.requestFullscreen();if(r)r.catch(()=>{})}catch{}}
}
$('#v').addEventListener('load',()=>{try{$('#v').contentWindow.postMessage(JSON.stringify({event:'listening',id:1}),'*')}catch{}});
addEventListener('message',e=>{
  if(!/youtube/.test(e.origin))return;
  try{
    const d=JSON.parse(e.data);ready=true;
    if(d.event==='onStateChange'){
      st=d.info;
      if(st===1){$('#po').hidden=true;bgState(true);setTimeout(()=>{if(st===1)bgState(true)},1200)}
      else if(st===2)bgState(false);
      if(st===0){if(cur+1>=view.length)bgState(false);play(cur+1)}
    }else if(d.event==='infoDelivery'&&d.info){
      const i=d.info;
      if(typeof i.currentTime==='number')tcur=i.currentTime;
      if(typeof i.duration==='number')tdur=i.duration;
      const n=Date.now();
      if((st===1||st===2)&&n-tLast>5000){tLast=n;bgState(st===1)}
    }
  }catch{}
});
addEventListener('popstate',()=>{if(menuOpen){menuOpen=false;menu.classList.add('out')}});

/* gestes sur les bords gauche/droit de la vidéo : haut = suivante, bas = précédente, droite = menu
   (centre, haut et bas laissés à YouTube : tap, barre de lecture, sous-titres, réglages) */
let sx=0,sy=0,moved=false;
document.querySelectorAll('.sw').forEach(sw=>{
  sw.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=false});
  sw.addEventListener('pointerup',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax>60&&ax>1.5*ay){moved=true;if(dx>0)openMenu()}
    else if(ay>60&&ay>1.5*ax){moved=true;play(cur+(dy<0?1:-1))}
  });
  sw.addEventListener('click',()=>{if(moved){moved=false;return}if(menuOpen)closeMenu()});
});
/* geste sur le menu : gauche = ranger */
let mx=0,my=0;
menu.addEventListener('touchstart',e=>{const t=e.changedTouches[0];mx=t.clientX;my=t.clientY},{passive:true});
menu.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-mx,dy=t.clientY-my;
  if(dx<-70&&Math.abs(dx)>1.5*Math.abs(dy))closeMenu();
},{passive:true});

/* événements */
$('#g').addEventListener('click',e=>{
  const ch=e.target.closest('.ch');
  if(ch){chan=ch.dataset.c;apply();scrollTo(0,0);return}
  const c=e.target.closest('.card');if(c)play(+c.dataset.i);
});
$('#info').addEventListener('click',e=>{if(e.target.id==='rc'){chan='';apply()}});
$('#q').addEventListener('input',apply);
$('#s').addEventListener('click',()=>{sort=sort==='recent'?'vus':'recent';$('#s').textContent=sort==='recent'?'Récents':'Plus vus';apply()});
$('#f').addEventListener('change',e=>{if(e.target.files.length)importer([...e.target.files]);e.target.value=''});
$('#mc').addEventListener('click',closeMenu);
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key;
  if(k==='Escape'||k==='ArrowLeft')closeMenu();
  else if(k==='ArrowRight')openMenu();
  else if(k==='m'||k==='M')menuOpen?closeMenu():openMenu();
  else if(menuOpen)return;
  else if(k==='ArrowDown')play(cur+1);
  else if(k==='ArrowUp')play(cur-1);
});
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{e.preventDefault();document.body.classList.add('drag')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();document.body.classList.remove('drag')}));
addEventListener('drop',e=>{if(e.dataTransfer.files.length)importer([...e.dataTransfer.files])});

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  const s=await load();if(s&&s.length)all=s;
  apply();
  if(all.length){
    let id='';try{id=localStorage.getItem('last')||''}catch{}
    const i=view.findIndex(v=>v.id===id);
    play(i<0?0:i,true);
  }else{menuOpen=true;menu.classList.remove('out')}
})();
</script>
</body>
</html>
